<!doctype html>
<html lang="en" class="scroll-smooth bg-black">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rychr — Creative Video Editor & Motion Designer</title>
    <meta name="description" content="Solo creative video editor & motion designer specializing in engaging content, high retention pacing, and After Effects motion graphics." />
    <meta property="og:title" content="Rychr — Creative Video Editor & Motion Designer" />
    <meta property="og:description" content="Solo creative video editor & motion designer specializing in engaging content, high retention pacing, and After Effects motion graphics." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" href="/assets/aistudio/image_5a1c3c4a.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <link href="https://fonts.cdnfonts.com/css/mazzard-m" rel="stylesheet" />
    <link href="https://fonts.cdnfonts.com/css/mazzard" rel="stylesheet" />
    <style>
      @import url('https://fonts.cdnfonts.com/css/mazzard-m');
      @import url('https://fonts.cdnfonts.com/css/mazzard');

      @font-face {
        font-family: 'Mazzard M Black';
        font-weight: 900;
        src: local('Mazzard M Black'), local('MazzardM-Black'), local('Mazzard Black');
      }

      /* Mazzard M Black - DEDICATED SOLELY to the brand name "Rychr" */
      .font-brand-rychr {
        font-family: 'Mazzard M Black', 'Mazzard M', 'Mazzard', 'Plus Jakarta Sans', sans-serif !important;
        font-weight: 900 !important;
        letter-spacing: -0.04em;
      }

      /* Headings, buttons, and subheadings use crisp, high-impact Plus Jakarta Sans */
      .font-mazzard,
      .font-heading,
      h1:not(.font-brand-rychr),
      h2,
      h3:not(.font-brand-rychr),
      h4 {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
        letter-spacing: -0.025em;
      }

      /* Body, descriptions, inputs, and regular text use Inter */
      body,
      p,
      input,
      textarea,
      select {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }

      /* Code / tags / technical numerals use JetBrains Mono */
      .font-mono,
      code {
        font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace !important;
      }

      @keyframes scrollPulse {
        0% { transform: translateY(-100%); opacity: 0; }
        40% { opacity: 1; }
        80% { opacity: 1; }
        100% { transform: translateY(220%); opacity: 0; }
      }
      .animate-scrollIndicator {
        animation: scrollPulse 2.2s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
    </style>
  </head>
  <body class="bg-black text-white selection:bg-white/20 selection:text-white antialiased m-0 p-0 overflow-x-hidden min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
